services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/zenshin?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      DEFAULT_SEED_PASSWORD: "${DEFAULT_SEED_PASSWORD:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      PORT: 4000
      NODE_ENV: development
    command: sh -c "npm run dev -w apps/api"
    volumes:
      - .:/app
      - zenshin_api_node_modules:/app/node_modules
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:4000}"
    command: sh -c "npm run dev -w apps/web -- --host 0.0.0.0 --port 3000"
    volumes:
      - .:/app
      - zenshin_web_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  zenshin_api_node_modules:
  zenshin_web_node_modules:
