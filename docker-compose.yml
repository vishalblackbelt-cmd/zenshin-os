version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zenshin_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zenshin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zenshin_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/zenshin?schema=public"
      JWT_SECRET: "zenshin_secret_key_12345"
      JWT_REFRESH_SECRET: "zenshin_refresh_secret_key_12345"
      PORT: 4000
      NODE_ENV: production
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zenshin_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
